name: all-in-one

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-in-one-main
  cancel-in-progress: false

jobs:
  merge-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tagged commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build all_in_one.md
        env:
          SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: bash scripts/build-all-in-one.sh "$SOURCE_REF"

      - name: Commit all_in_one.md onto main
        env:
          SOURCE_REF: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
        run: |
          set -euo pipefail
          cp all_in_one.md /tmp/all_in_one.md
          git fetch origin main
          git checkout -B main origin/main
          cp /tmp/all_in_one.md all_in_one.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add all_in_one.md
          if git diff --staged --quiet; then
            echo "all_in_one.md unchanged"
            exit 0
          fi
          git commit -m "Rebuild all_in_one.md from ${SOURCE_REF}."
          git push origin main
